<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISKS 2026 — Task Queue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="relative min-h-screen overflow-x-hidden">
  <!-- Diagonale strepen: rustig achtergrondaccent achter de branding, niet naast het paneel. -->
  <div
    class="pointer-events-none absolute -left-20 top-56 h-64 w-64 rotate-12 opacity-30"
    style="background-image: repeating-linear-gradient(45deg, #175B57 0 5px, transparent 5px 15px)"
  ></div>

  <main class="relative z-10 mx-auto grid max-w-7xl items-start gap-12 px-6 pb-24 pt-12 lg:grid-cols-12 lg:gap-14 lg:pb-28 lg:pt-20">
    <!-- Branding: compact supportvlak, geen hero. -->
    <header class="lg:col-span-4 lg:pt-6">
      <div class="inline-block border-l-4 border-isks-orange bg-isks-teal-dark bg-dots-dark bg-[length:14px_14px] px-6 py-5">
        <p class="isks-eyebrow">ISKS 2026</p>
        <img
          src="/built-to-last-logo.png"
          alt="Built to Last"
          width="629"
          height="510"
          class="mt-3 w-[13rem] max-w-full"
        />
      </div>

      <!-- Technisch lijndetail dat de branding aan de compositie hangt. -->
      <div class="ml-6 mt-0 hidden lg:block">
        <div class="h-28 w-px bg-isks-mint/50"></div>
        <div class="-ml-[3px] h-[7px] w-[7px] bg-isks-orange"></div>
      </div>
    </header>

    <!-- Task Queue: het hoofdvlak van de pagina. -->
    <section class="relative lg:col-span-8">
      <span class="isks-bracket -left-4 -top-4 border-l-4 border-t-4"></span>
      <span class="isks-bracket -bottom-4 -right-4 border-b-4 border-r-4"></span>
      <div id="app" class="isks-panel"></div>
    </section>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
